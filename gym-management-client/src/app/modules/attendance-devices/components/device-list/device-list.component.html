<div class="page-header">
    <h2 class="page-title">Quản lý Thiết bị điểm danh</h2>
</div>

<div class="content-card">
    <dx-data-grid [dataSource]="dataSource" [showBorders]="false" [rowAlternationEnabled]="true" [columnAutoWidth]="true"
        [allowColumnResizing]="true" [remoteOperations]="{ paging: true }">

        <dxo-editing mode="popup" [allowAdding]="true" [allowUpdating]="true" [allowDeleting]="true">
            <dxo-popup title="Thông tin Thiết bị" [showTitle]="true" [width]="600" [height]="420"></dxo-popup>
        </dxo-editing>

        <dxo-filter-row [visible]="true"></dxo-filter-row>
        <dxo-search-panel [visible]="true" placeholder="Tìm kiếm..."></dxo-search-panel>
        <dxo-paging [pageSize]="10"></dxo-paging>
        <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[5, 10, 20]" [showInfo]="true"></dxo-pager>

        <dxi-column dataField="name" caption="Tên thiết bị">
            <dxi-validation-rule type="required"></dxi-validation-rule>
        </dxi-column>
        <dxi-column dataField="location" caption="Vị trí"></dxi-column>
        <dxi-column dataField="vendor" caption="Hãng">
            <dxo-lookup [dataSource]="vendorOptions" valueExpr="value" displayExpr="text"></dxo-lookup>
            <dxi-validation-rule type="required"></dxi-validation-rule>
        </dxi-column>
        <dxi-column dataField="serialNumber" caption="Số sê-ri"></dxi-column>
        <dxi-column dataField="isActive" caption="Hoạt động" dataType="boolean"></dxi-column>
        <dxi-column dataField="createdAt" caption="Ngày tạo" dataType="date" format="dd/MM/yyyy" [allowEditing]="false"></dxi-column>
    </dx-data-grid>
</div>
