<div class="page-header">
    <h2 class="page-title">Quản lý Thành viên</h2>
</div>

<div class="content-card">
    <dx-data-grid [dataSource]="dataSource" [showBorders]="false" [rowAlternationEnabled]="true" [columnAutoWidth]="true"
        [allowColumnResizing]="true" [remoteOperations]="{ paging: true }">

        <dxo-editing mode="popup" [allowAdding]="true" [allowUpdating]="true" [allowDeleting]="true">
            <dxo-popup title="Thông tin Thành viên" [showTitle]="true" [width]="700" [height]="525"></dxo-popup>
        </dxo-editing>

        <dxo-filter-row [visible]="true"></dxo-filter-row>
        <dxo-search-panel [visible]="true" placeholder="Tìm kiếm..."></dxo-search-panel>
        <dxo-paging [pageSize]="10"></dxo-paging>
        <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[5, 10, 20]" [showInfo]="true"></dxo-pager>

        <dxi-column dataField="fullName" caption="Họ tên"></dxi-column>
        <dxi-column dataField="phoneNumber" caption="Số điện thoại"></dxi-column>
        <dxi-column dataField="email" caption="Email"></dxi-column>
        <dxi-column dataField="gender" caption="Giới tính">
            <dxo-lookup [dataSource]="genderOptions" valueExpr="value" displayExpr="text"></dxo-lookup>
        </dxi-column>
        <dxi-column dataField="dateOfBirth" caption="Ngày sinh" dataType="date" format="dd/MM/yyyy"></dxi-column>
        <dxi-column dataField="address" caption="Địa chỉ" [visible]="false"></dxi-column>
        <dxi-column dataField="emergencyName" caption="Liên hệ khẩn" [visible]="false"></dxi-column>
        <dxi-column dataField="emergencyPhone" caption="SĐT khẩn" [visible]="false"></dxi-column>
        <dxi-column dataField="registrationDate" caption="Ngày ĐK" dataType="date" format="dd/MM/yyyy"></dxi-column>
        <dxi-column dataField="status" caption="Trạng thái">
            <dxo-lookup [dataSource]="statusOptions" valueExpr="value" displayExpr="text"></dxo-lookup>
        </dxi-column>
        <dxi-column dataField="notes" caption="Ghi chú" [visible]="false"></dxi-column>
        <dxi-column caption="Ảnh" [width]="100" [allowEditing]="false" [allowFiltering]="false" [allowSorting]="false"
            cellTemplate="cameraTemplate"></dxi-column>

        <div *dxTemplate="let cell of 'cameraTemplate'">
            <button mat-icon-button color="primary" (click)="openCamera(cell.data)" title="Chụp ảnh">
                <mat-icon>photo_camera</mat-icon>
            </button>
            <button mat-icon-button color="accent" (click)="fileInput.click()" title="Tải ảnh lên">
                <mat-icon>upload_file</mat-icon>
            </button>
            <input #fileInput type="file" accept="image/*" hidden (change)="onFileSelected($event, cell.data)">
        </div>
    </dx-data-grid>
</div>
