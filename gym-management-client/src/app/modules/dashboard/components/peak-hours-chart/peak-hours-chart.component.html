<div class="chart-card">
  <h3>Giờ cao điểm (30 ngày qua)</h3>
  <div class="loading-row" *ngIf="loading">
    <mat-spinner diameter="32"></mat-spinner>
  </div>
  <p *ngIf="error" class="error-state">Không thể tải dữ liệu giờ cao điểm. Vui lòng thử lại sau.</p>
  <div class="chart-host" *ngIf="!loading && !error">
    <canvas baseChart type="bar" [labels]="labels" [datasets]="datasets" [options]="options"></canvas>
  </div>
</div>
