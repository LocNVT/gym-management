<div class="page-header">
    <h2 class="page-title">Quản lý Hóa đơn</h2>
</div>

<div class="content-card">
    <dx-data-grid [dataSource]="dataSource" [showBorders]="false" [rowAlternationEnabled]="true" [columnAutoWidth]="true"
        [remoteOperations]="{ paging: true }">

        <dxo-editing mode="popup" [allowAdding]="true" [allowUpdating]="true" [allowDeleting]="true">
            <dxo-popup title="Thông tin Hóa đơn" [showTitle]="true" [width]="700" [height]="450"></dxo-popup>
        </dxo-editing>
        <dxo-filter-row [visible]="true"></dxo-filter-row>
        <dxo-search-panel [visible]="true" placeholder="Tìm kiếm..."></dxo-search-panel>
        <dxo-paging [pageSize]="10"></dxo-paging>
        <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[5, 10, 20]" [showInfo]="true"></dxo-pager>

        <dxi-column dataField="invoiceNumber" caption="Số hóa đơn"></dxi-column>
        <dxi-column dataField="memberId" caption="Thành viên">
            <dxo-lookup [dataSource]="members" valueExpr="id" displayExpr="fullName"></dxo-lookup>
        </dxi-column>
        <dxi-column dataField="invoiceDate" caption="Ngày lập" dataType="date" format="dd/MM/yyyy"></dxi-column>
        <dxi-column dataField="totalAmount" caption="Tổng tiền" dataType="number" format="#,##0 VNĐ"></dxi-column>
        <dxi-column dataField="status" caption="Trạng thái">
            <dxo-lookup [dataSource]="statusOptions" valueExpr="value" displayExpr="text"></dxo-lookup>
        </dxi-column>
        <dxi-column dataField="paymentMethod" caption="Phương thức TT">
            <dxo-lookup [dataSource]="paymentMethodOptions" valueExpr="value" displayExpr="text"></dxo-lookup>
        </dxi-column>
        <dxi-column dataField="notes" caption="Ghi chú" [visible]="false"></dxi-column>
    </dx-data-grid>
</div>
