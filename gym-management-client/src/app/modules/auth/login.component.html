<div class="login-wrapper">
    <!-- Left branding panel -->
    <div class="login-left">
        <div class="brand-hero">
            <mat-icon class="hero-icon">fitness_center</mat-icon>
            <h1 class="hero-title">FitGym Manager</h1>
            <p class="hero-sub">Hệ thống quản lý phòng tập chuyên nghiệp</p>
        </div>
    </div>

    <!-- Right form panel -->
    <div class="login-right">
        <div class="login-form-wrap">
            <h2 class="form-heading">Đăng nhập</h2>
            <p class="form-subheading">Nhập thông tin tài khoản của bạn</p>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Tên đăng nhập</mat-label>
                    <input matInput formControlName="username" placeholder="Nhập tên đăng nhập">
                    <mat-icon matPrefix>person</mat-icon>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Mật khẩu</mat-label>
                    <input matInput formControlName="password" [type]="hidePassword ? 'password' : 'text'"
                        placeholder="Nhập mật khẩu">
                    <mat-icon matPrefix>lock</mat-icon>
                    <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
                        <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                    </button>
                </mat-form-field>

                <div class="error-message" *ngIf="errorMessage">
                    <mat-icon>error</mat-icon>
                    {{ errorMessage }}
                </div>

                <button mat-raised-button color="primary" type="submit" class="full-width login-btn"
                    [disabled]="loginForm.invalid || isLoading">
                    <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
                    <span *ngIf="!isLoading">Đăng nhập</span>
                </button>
            </form>

            <div class="divider"><span>hoặc</span></div>

            <div #googleBtn class="google-btn-container"></div>
        </div>
    </div>
</div>
